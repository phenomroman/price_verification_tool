swagger: '2.0'
info:
  title: Price Verification API Gateway
  description: Secure gateway for the Price Verification Tool
  version: 1.0.0
schemes:
  - https
produces:
  - application/json
paths:
  /:
    get:
      summary: Root endpoint
      operationId: read_root
      x-google-backend:
        address: https://api-service-1019385345956.asia-southeast1.run.app
      responses:
        '200':
          description: OK
  /predict:
    post:
      summary: Predict Price
      operationId: predict_price
      x-google-backend:
        address: https://api-service-1019385345956.asia-southeast1.run.app/predict
      security:
        - api_key: []
      responses:
        '200':
          description: OK
  /predict/excel:
    post:
      summary: Predict Price (Excel)
      operationId: predict_excel
      x-google-backend:
        address: https://api-service-1019385345956.asia-southeast1.run.app/predict/excel
      security:
        - api_key: []
      responses:
        '200':
          description: OK
securityDefinitions:
  api_key:
    type: apiKey
    name: key
    in: query
