steps:
  # 0. Pull latest images for caching (ignore failure if not exists)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull asia-southeast1-docker.pkg.dev/$PROJECT_ID/price-verification-repo/api-service:latest || true
        docker pull asia-southeast1-docker.pkg.dev/$PROJECT_ID/price-verification-repo/web-service:latest || true

  # 1. Build API Container with caching
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/price-verification-repo/api-service', 
      '--cache-from', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/price-verification-repo/api-service:latest',
      '-f', 'Dockerfile.api', 
      '.'
    ]

  # 2. Build Web Container with caching
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/price-verification-repo/web-service', 
      '--cache-from', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/price-verification-repo/web-service:latest',
      '-f', 'Dockerfile.web', 
      '.'
    ]

  # 3. Push API Container to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/price-verification-repo/api-service']

  # 4. Push Web Container to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/price-verification-repo/web-service']

  # 5. Deploy API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'api-service'
      - '--image'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/price-verification-repo/api-service'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated' # Gateway needs this to reach backend
      - '--ingress'
      - 'internal' # Only allows traffic from Gateway/Internal networks
      - '--set-secrets'
      - 'API_KEYS=api-service-api-keys:latest' # Maps cloud secret to ENV var
      # Mount models (ensure SA has permissions)
      - '--add-volume=name=models,type=cloud-storage,bucket=price-verification-models,readonly=true'
      - '--add-volume-mount=volume=models,mount-path=/app/price_models'
      # Resource allocation
      - '--cpu=1'
      - '--memory=1Gi'
      - '--cpu-boost'
      - '--timeout=300'

  # 6. Deploy Web to Cloud Run
  # Note: The Web service needs to know the API URL. 
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'web-service'
      - '--image'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/price-verification-repo/web-service'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--session-affinity'
      - '--set-env-vars'
      - 'API_URL=https://api-service-1019385345956.asia-southeast1.run.app,EXTERNAL_API_URL=https://price-api-gateway-d0arpqxw.an.gateway.dev'
      - '--set-secrets'
      - 'API_KEY=api-gateway-key:latest' 
      # Mount models (ensure SA has permissions)
      - '--add-volume=name=models,type=cloud-storage,bucket=price-verification-models,readonly=true'
      - '--add-volume-mount=volume=models,mount-path=/app/price_models'
      # Resource allocation
      - '--cpu=1'
      - '--memory=512Mi'
      - '--cpu-boost'
      - '--timeout=300'
options:
    logging: CLOUD_LOGGING_ONLY
images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/price-verification-repo/api-service'
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/price-verification-repo/web-service'
